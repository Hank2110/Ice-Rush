name: Build PC
on: workflow_dispatch
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack project and music
        shell: bash
        run: |
          python - <<'PY'
          import zipfile, glob, os, shutil, sys
          print('Файлы в корне:', sorted(os.listdir('.')))
          proj = glob.glob('**/IceRush_PC_project.zip', recursive=True)
          if not proj:
              print('ОШИБКА: IceRush_PC_project.zip не найден в репозитории. Загрузите его: Add file > Upload files.')
              sys.exit(1)
          zipfile.ZipFile(proj[0]).extractall('.')
          musics = sorted(glob.glob('**/music_part*.zip', recursive=True))
          print('Архивы музыки:', musics)
          for z in musics:
              zipfile.ZipFile(z).extractall('.')
          os.makedirs('IceRush_PC/app/music', exist_ok=True)
          n = 0
          for f in glob.glob('IceRush_Android/app/src/main/assets/music/*.mp3'):
              shutil.copy(f, 'IceRush_PC/app/music/')
              n += 1
          print('Скопировано треков:', n)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Windows exe
        shell: bash
        working-directory: IceRush_PC
        run: |
          npm install
          npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: IceRush-Windows
          path: IceRush_PC/dist/*.exe
