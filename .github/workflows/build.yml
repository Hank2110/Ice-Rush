name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o IceRush_Android_project.zip
          find . -iname '*.zip' ! -name 'IceRush_Android_project.zip' -exec unzip -o {} \;
      - run: |
          ID=$(tr -d ' \r\n' < community.txt 2>/dev/null || true)
          if [ -n "$ID" ]; then sed -i "s/__COMMUNITY_ID__/$ID/" IceRush_Android/app/src/main/assets/index.html; fi
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - run: gradle assembleRelease
        working-directory: IceRush_Android
      - uses: actions/upload-artifact@v4
        with: {name: IceRush-apk, path: IceRush_Android/app/build/outputs/apk/release/app-release.apk}
